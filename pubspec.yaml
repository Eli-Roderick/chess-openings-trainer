name: repertoire_trainer
description: Offline-first chess openings repertoire trainer.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5

workspace:
  - packages/chess_core
  - packages/uci_engine

dependencies:
  chess_core: any
  chessground: ^10.3.0
  collection: ^1.19.1
  crypto: ^3.0.7
  dartchess: ^0.14.0
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_soloud: ^5.1.6
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.4
  http: ^1.6.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logging: ^1.3.0
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  uci_engine: any
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  archive: ^4.3.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  fake_async: ^1.3.3
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/demo/
    - assets/openings/
    - assets/sounds/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# App icon (P13): `dart run flutter_launcher_icons`. The knight is DejaVu
# Sans U+265E on the theme green (THIRD_PARTY.md).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#4E7D3A"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 24
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256

