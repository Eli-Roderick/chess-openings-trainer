name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Generate code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
      - name: Generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::Generated files are out of date; run build_runner and gen-l10n and commit the result."
            exit 1
          fi
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test chess_core (with coverage)
        working-directory: packages/chess_core
        run: dart test --coverage=coverage
      - name: chess_core coverage >= 90 %
        run: >-
          dart run tool/check_coverage.dart --package packages/chess_core
          --min 90 lib lib/src/pgn lib/src/tree
      - name: Test uci_engine
        working-directory: packages/uci_engine
        run: dart test --exclude-tags engine
      - name: Test app (includes the import-boundary test)
        run: flutter test

  engine-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev xvfb
      - uses: ./.github/actions/setup-flutter
      - uses: actions/cache@v4
        with:
          path: engine/.cache
          key: engines-linux-${{ hashFiles('engine/checksums.json') }}
      - name: Fetch Stockfish (linux)
        run: dart run tool/fetch_engines.dart --platform linux
      - name: Engine-tagged tests
        working-directory: packages/uci_engine
        run: dart test --tags engine
      - name: Integration tests (Linux desktop)
        run: xvfb-run -a flutter test integration_test -d linux

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: ./.github/actions/setup-flutter
      - uses: actions/cache@v4
        with:
          path: engine/.cache
          key: engines-android-${{ hashFiles('engine/checksums.json') }}
      - name: Fetch Stockfish (android)
        run: dart run tool/fetch_engines.dart --platform android
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/release.jks
            printf '%s\n' "$KEY_PROPERTIES" | tr -d '\r' | grep -v '^storeFile=' > android/key.properties
            echo 'storeFile=release.jks' >> android/key.properties
            echo "Signing with the release key; certificate:"
            keytool -list -v -keystore android/release.jks \
              -storepass "$(sed -n 's/^storePassword=//p' android/key.properties)" \
              | grep -E 'Alias name|SHA1:|SHA256:'
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PROPERTIES are not set; this APK is debug-signed and will not install over a release-signed build."
          fi
      - name: Build APKs
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: repertoire-trainer-android-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - uses: actions/cache@v4
        with:
          path: engine/.cache
          key: engines-windows-${{ hashFiles('engine/checksums.json') }}
      - name: Fetch Stockfish (windows)
        run: dart run tool/fetch_engines.dart --platform windows
      - name: Build Windows
        run: flutter build windows --release
      - name: Check engine is bundled
        shell: bash
        run: ls -l build/windows/x64/runner/Release/engine/stockfish-avx2.exe build/windows/x64/runner/Release/engine/stockfish-sse41.exe
      - uses: actions/upload-artifact@v4
        with:
          name: repertoire-trainer-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
