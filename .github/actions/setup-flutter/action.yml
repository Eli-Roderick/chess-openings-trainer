name: Set up Flutter
description: Installs the Flutter version pinned in .flutter-version (with SDK and pub caches) and runs flutter pub get.
runs:
  using: composite
  steps:
    - name: Read pinned Flutter version
      id: version
      shell: bash
      run: echo "flutter=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ steps.version.outputs.flutter }}
        cache: true
    - name: flutter pub get
      shell: bash
      run: flutter pub get
